<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Surprise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('gif-heart.gif') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: brown;
        }
        .container {
            max-width: 500px;
            width: 90%;
            margin: 50px auto;
            background: url('gif-heart.gif') no-repeat center center fixed;
            padding: 50px;
            border-radius: 70px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeIn 1s forwards;
        }
        h1, h2 {
            font-size: 2.5em;
            margin: 10px 0;
            animation: slideIn 1s ease-out;
        }
        p {
            color: black;
        }
        input[type="text"], input[type="password"] {
            width: 80%;
            max-width: 350px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            transition: all 0.3s ease-in-out;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ff4d4d;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.8);
        }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            width: 80%;
            max-width: 350px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #e60000;
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
        .image-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .image-gallery img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            animation: fadeInImage 1s forwards;
        }
        .response-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .response-container button {
            width: auto;
            padding: 15px 30px;
        }

        .next-btn {
            width: 80%;
            max-width: 350px;
            background-color: #ff1a1a;
            font-size: 1.2em;
            padding: 12px;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInImage {
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }

        /* Media Queries */
        @media (max-width: 768px) {
            h1, h2 {
                font-size: 2em;
            }
            button {
                padding: 15px;
                font-size: 1.1em;
                width: 80%;
                max-width: 350px;
            }
            .response-container {
                flex-direction: column;
                gap: 15px;
            }
            .image-gallery img {
                max-width: 45%;
            }
        }

        @media (max-width: 480px) {
            h1, h2 {
                font-size: 1.5em;
            }
            button {
                font-size: 1em;
                padding: 12px;
                width: 80%;
                max-width: 350px;
            }
            .container {
                margin: 20px;
                padding: 15px;
            }
            .image-gallery img {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="login-section">
        <h1>Welcome to Your Valentine Surprise!</h1>
        <p>ENJOY THE FEELING.</p>
        <input type="text" id="username" placeholder="Enter your name" required>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button onclick="showSurprise()">Sign Up</button>
    </div>

    <div class="container hidden" id="surprise-section">
        <h1>Hi, By💖!</h1>
        <p>You’ve unlocked a special surprise! I hope you enjoy...:)</p>
        
        <!-- Image Gallery with Multiple Pictures -->
        <div class="image-gallery">
            <img src="boy.jpg" alt="Picture 2">
        </div>

        <button class="next-btn" onclick="goToQuestion()">Next</button>
    </div>

    <!-- Separate Question Section -->
    <div class="container hidden" id="question-section">
        <h2>Would you make my heart complete and be my Valentine on February 14?</h2>
        <div class="response-container">
            <button onclick="response('yes')">YES 💖</button>
            <button onclick="response('no')">NO 😢</button>
        </div>
    </div>

    <!-- "Are You Sure?" Confirmation -->
    <div class="container hidden" id="confirm-section">
        <h2>Are you sure?</h2>
        <div class="response-container">
            <button onclick="finalResponse('yes')">Yes, I'm sure 💘</button>
            <button onclick="finalResponse('no')">No, I changed my mind 💔</button>
        </div>
    </div>

    <!-- Response Section -->
    <div class="container hidden" id="response-section">
        <h1 id="response-message"></h1>
    </div>

    <script>
        function showSurprise() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('surprise-section').classList.remove('hidden');
        }

        function goToQuestion() {
            document.getElementById('surprise-section').classList.add('hidden');
            document.getElementById('question-section').classList.remove('hidden');
        }

        function response(answer) {
            if (answer === 'yes') {
                document.getElementById('question-section').classList.add('hidden');
                document.getElementById('confirm-section').classList.remove('hidden');
            } else {
                const message = "Oh no! Maybe next time. 😢";
                document.getElementById('question-section').classList.add('hidden');
                document.getElementById('response-section').classList.remove('hidden');
                document.getElementById('response-message').textContent = message;
            }
        }

        function finalResponse(answer) {
            const message = answer === 'yes' 
                ? "Yay! Can't wait to spend Valentine's Day with you! thank you..❤️"
                : "Oh no! Maybe next time. 😢";
            document.getElementById('confirm-section').classList.add('hidden');
            document.getElementById('response-section').classList.remove('hidden');
            document.getElementById('response-message').textContent = message;
        }
    </script>
</body>
</html>
